packages:
  - packages/*
  - apps/*
allowBuilds:
  core-js: false
  core-js-pure: false
  '@parcel/watcher': false
  '@tarojs/binding': false
  '@tarojs/cli': false
  esbuild: true
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
minimumReleaseAgeExclude:
  - '@swc/core-darwin-arm64@1.16.21'
  - '@swc/core-darwin-x64@1.16.21'
  - '@swc/core-linux-arm-gnueabihf@1.16.21'
  - '@swc/core-linux-arm64-gnu@1.16.21'
  - '@swc/core-linux-arm64-musl@1.16.21'
  - '@swc/core-linux-ppc64-gnu@1.16.21'
  - '@swc/core-linux-s390x-gnu@1.16.21'
  - '@swc/core-linux-x64-gnu@1.16.21'
  - '@swc/core-linux-x64-musl@1.16.21'
  - '@swc/core-win32-arm64-msvc@1.16.21'
  - '@swc/core-win32-ia32-msvc@1.16.21'
  - '@swc/core-win32-x64-msvc@1.16.21'
  - '@swc/core@1.16.21'
